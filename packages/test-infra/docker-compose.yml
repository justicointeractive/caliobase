services:
  postgres:
    image: postgres:13.1
    ports:
      - "5832:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - ./init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 30s
      timeout: 10s
      retries: 5
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - mysql:/var/lib/mysql
  redis:
    image: redis:6.0.9
    ports:
      - "6893:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
  localstack:
    image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - EDGE_PORT=4566
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 10s
      retries: 5
  init-localstack:
    image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    entrypoint: /bin/bash
    command: -c "awslocal sqs create-queue --queue-name caliobase-shared-queue-dead-letter-queue && awslocal sqs create-queue --queue-name caliobase-shared-queue"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: testtest
      RUSTFS_SECRET_KEY: testtest
      RUSTFS_SERVER_DOMAINS: s3.localhost.localstack.cloud
      RUSTFS_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    volumes:
      - rustfs:/data
  init-rustfs:
    image: amazon/aws-cli:2.31.16@sha256:8d4162b313590e71cfd5083e4d33079792137a5ddac3b10ead25aa2da4a558a4
    entrypoint: /bin/sh
    command:
      - -ec
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket caliobase ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket caliobase
    environment:
      AWS_ACCESS_KEY_ID: testtest
      AWS_SECRET_ACCESS_KEY: testtest
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      rustfs:
        condition: service_healthy
  init-postgres:
    image: postgres:13.1
    entrypoint: /bin/bash
    command: -c "createdb -h postgres -U test caliobase || true && createdb -h postgres -U test typeorm-migrations || true && createdb -h postgres -U test caliosbaseexampleapp || true"
    environment:
      PGPASSWORD: test
    depends_on:
      postgres:
        condition: service_healthy
  init-mysql:
    image: mysql:8.0
    entrypoint: /bin/bash
    command: -c "mysql -h mysql -u root -proot -e 'CREATE DATABASE IF NOT EXISTS typeormtest; CREATE USER IF NOT EXISTS \"typeormtest\"@\"%\" IDENTIFIED BY \"typeormtest\"; GRANT ALL PRIVILEGES ON typeormtest.* TO \"typeormtest\"@\"%\"; FLUSH PRIVILEGES;'"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  rustfs:
  postgres:
  mysql:
  redis:
