name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate/build without publishing or tagging'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('caliobase-release-pr-{0}', github.event.pull_request.number) || 'caliobase-release-main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - name: Check reviewed version bumps
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          args=(check "--base=$RELEASE_BASE")
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then args+=(--allow-published); fi
          npm run release -- "${args[@]}" | tee /tmp/release-check.log
          cat /tmp/release-check.log >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish reviewed versions
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_BASE: ${{ github.event.before || 'HEAD^' }}
      CI: true
      NPM_CONFIG_PROVENANCE: true
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-compose-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support
        if: env.RELEASE_DRY_RUN != 'true'
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Configure tag author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Start test infrastructure
        run: docker compose -f packages/test-infra/docker-compose.yml up -d
      - name: Wait for services
        working-directory: packages/test-infra
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U test -d test -h localhost; do sleep 5; done'
          timeout 60 bash -c 'until docker compose exec -T mysql mysqladmin ping -h localhost --silent; do sleep 5; done'
          timeout 60 bash -c 'until docker compose exec -T redis redis-cli ping; do sleep 5; done'
          timeout 120 bash -c 'until docker compose exec -T localstack awslocal sqs list-queues > /dev/null 2>&1; do sleep 5; done'
          bash ./wait-object-storage.sh
      - run: npm run test
      - name: Publish committed manifest versions
        run: |
          args=(publish "--base=$RELEASE_BASE")
          if [[ "$RELEASE_DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          npm run release -- "${args[@]}"
      - name: Push release markers
        if: env.RELEASE_DRY_RUN != 'true'
        run: npm run release -- tag "--base=$RELEASE_BASE"
      - name: Cleanup test infrastructure
        if: always()
        run: docker compose -f packages/test-infra/docker-compose.yml down -v
